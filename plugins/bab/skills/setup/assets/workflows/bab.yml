name: bab

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
  issues:
    types: [opened, edited, closed]
  push:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  guard:
    uses: freevue/bab-skill/.github/workflows/bab-guard.yml@v0.7.3
    with:
      bab-ref: v0.7.3
