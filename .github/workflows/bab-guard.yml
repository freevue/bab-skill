name: bab guard

on:
  workflow_call:
    inputs:
      bab-ref:
        description: 검사 스크립트를 가져올 freevue/bab-skill의 태그나 브랜치
        type: string
        default: main

jobs:
  pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: freevue/bab-skill
          ref: ${{ inputs.bab-ref }}
          path: .bab
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/checkout@v4
        if: ${{ !cancelled() }}
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .bab-base
      - name: 형상 일치
        if: ${{ !cancelled() }}
        run: |
          node .bab/plugins/bab/ci/drift-check.mjs .bab-base --json > "$RUNNER_TEMP/base.json" || test -s "$RUNNER_TEMP/base.json"
          node .bab/plugins/bab/ci/drift-check.mjs . --json > "$RUNNER_TEMP/head.json" || test -s "$RUNNER_TEMP/head.json"
          node .bab/plugins/bab/ci/drift-diff.mjs "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json"

  issue:
    if: >-
      github.event_name == 'issues' &&
      (github.event.action == 'opened' || github.event.action == 'edited' || github.event.action == 'closed')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: freevue/bab-skill
          ref: ${{ inputs.bab-ref }}
          path: .bab
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 중요도 동기화 · 상태 정리
        run: node .bab/plugins/bab/ci/issue-sync.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  issue-gate:
    if: >-
      github.event_name == 'pull_request_target' || github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
        (github.event.action == 'closed' || github.event.action == 'reopened' ||
          ((github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
            startsWith(github.event.label.name, 'status:'))))
    concurrency:
      group: bab-issue-gate-${{ github.repository }}
      queue: max
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
      statuses: write
    steps:
      # 쓰기 토큰이 있는 작업은 배포된 bab 스크립트만 실행합니다.
      - uses: actions/checkout@v4
        with:
          repository: freevue/bab-skill
          ref: ${{ inputs.bab-ref }}
          path: .bab
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 열린 PR의 이슈 연결 · 확정 상태 검사
        run: node .bab/plugins/bab/ci/recheck-prs.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  drift:
    concurrency:
      group: bab-drift-${{ github.repository }}
      cancel-in-progress: false
    if: >-
      github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: freevue/bab-skill
          ref: ${{ inputs.bab-ref }}
          path: .bab
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 드리프트 검사
        run: node .bab/plugins/bab/ci/drift-check.mjs . --json > "$RUNNER_TEMP/drift.json" || test -s "$RUNNER_TEMP/drift.json"
      - name: 드리프트 이슈 동기화
        run: node .bab/plugins/bab/ci/drift-report.mjs "$RUNNER_TEMP/drift.json"
        env:
          GH_TOKEN: ${{ github.token }}
