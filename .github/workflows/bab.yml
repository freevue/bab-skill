name: bab

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
  pull_request_target:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled, closed]
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled]
  push:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
  statuses: write

jobs:
  guard:
    uses: freevue/bab-skill/.github/workflows/bab-guard.yml@v0.8.1
    with:
      bab-ref: v0.8.1
